/* Final Approach component styles, design system v2. Every colour comes from a token; so does every
   outline, radius, lip and control height. Classes are prefixed fa-.
   UI rules (brand-book.md): U1 moulded, not boxed. U2 a lip means pressable. U3 thin line, thick form.
   U4 tinted inside. U5 nested radii. U6 tower paperwork. U7 disabled is flat, not faded. */

/* ---------- Stages: the grounds components sit on ---------- */
.fa-stage { box-sizing: border-box; min-height: 100vh; margin: 0; padding: var(--space-5); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--space-5); font: 600 16px/24px var(--font-body); color: var(--on-sky); background: var(--bg-sky); }
.fa-stage--sky { background: repeating-conic-gradient(from 0deg at 50% 135%, var(--sky-300) 0 9deg, var(--bg-sky) 9deg 18deg); }
/* The mown airfield lawn: two neighbouring grass steps, so the stripes stay quiet (W8). */
.fa-stage--field, .fa-field { background: repeating-linear-gradient(97deg, var(--grass-500) 0 52px, var(--grass-600) 52px 104px); }
.fa-stage--meadow { background: var(--grass-500); }
.fa-stage--surface { background: var(--paper-100); color: var(--ink); }
.fa-stage--start { justify-content: flex-start; }
.fa-stage--col { flex-direction: column; }
.fa-stage *, .fa-stage *::before, .fa-stage *::after { box-sizing: border-box; }
.fa-note { font: 800 13px/16px var(--font-text); letter-spacing: .08em; text-transform: uppercase; }
.fa-item { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }

/* ---------- Aircraft paint (unchanged from v1: aircraft keep line-hero) ---------- */
.fa-p { stroke: var(--outline); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
.fa-p-body { fill: var(--fuselage); }
.fa-p-liv { fill: var(--fa-livery, var(--tangerine)); }
.fa-p-shade { fill: var(--fuselage-shade); }
.fa-p-glass { fill: var(--glass); stroke-width: 3; }
.fa-p-shine { fill: none; stroke: var(--glass-shine); stroke-width: 2.5; }
.fa-p-dark { fill: var(--outline); stroke: none; }
.fa-p-blur { fill: var(--prop-blur); stroke: none; opacity: .45; }
.fa-p-line { fill: none; stroke-width: 4.5; }
.fa-p-edge { fill: var(--outline); stroke-width: 8; }
.fa-p-poof { fill: var(--poof); stroke: none; }
.fa-p-poof-shade { fill: none; stroke: var(--poof-shade); stroke-width: 5; }
.fa-p-poof-o { fill: var(--poof); }
.fa-p-ray { fill: none; stroke-width: 5; }
.fa-p-star { fill: var(--star); }
.fa-p-silhouette { fill: var(--sunset-silhouette); stroke: none; }
.fa-p-tower-light { fill: var(--sunset-tower-light); stroke: none; }
/* Paint on the ground: runway numbers and the callsign tag in a scene. */
.fa-p-num { fill: var(--marking); font: 700 27px/1 var(--font-display); }
.fa-p-callsign { fill: var(--on-outline); font: 800 23px/1 var(--font-text); letter-spacing: .04em; }

/* ---------- World elements ---------- */
fa-aircraft, fa-side-aircraft, fa-silhouette, fa-icon, fa-runway, fa-helipad, fa-cloud, fa-windsock, fa-burst, fa-scenery, fa-scene { display: inline-block; flex: none; line-height: 0; }
fa-aircraft svg, fa-side-aircraft svg, fa-silhouette svg, fa-icon svg, fa-runway svg, fa-helipad svg, fa-cloud svg, fa-windsock svg, fa-burst svg, fa-scenery svg, fa-scene svg { display: block; width: 100%; height: 100%; overflow: visible; }
fa-scene { display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--grass-500); }
fa-scene svg { overflow: hidden; }
fa-aircraft { position: relative; width: var(--fa-size, 64px); height: var(--fa-size, 64px); filter: drop-shadow(5px 8px 3px var(--shadow-ground)); }
fa-aircraft[flat] { filter: none; }
.fa-aircraft__sprite { display: block; width: 100%; height: 100%; transition: transform var(--dur-quick) var(--ease-snap); }
.fa-aircraft__ring { position: absolute; inset: -24%; width: 148%; height: 148%; animation: fa-spin 7s linear infinite; }
.fa-ring-casing, .fa-ring-dash { fill: none; stroke-linecap: round; stroke-dasharray: 13 12.7; }
.fa-ring-casing { stroke: var(--outline); stroke-width: 7; }
.fa-ring-dash { stroke: var(--select-ring); stroke-width: 3.5; }
.fa-callsign { position: absolute; top: calc(100% + 10px); left: 50%; transform: translateX(-50%); padding: 3px 7px; border-radius: var(--radius-chip); background: var(--outline); color: var(--on-outline); font: 800 12px/14px var(--font-text); letter-spacing: .04em; white-space: nowrap; }
.fa-prop { transform-box: fill-box; transform-origin: center; animation: fa-prop var(--dur-rotor) linear infinite; }
.fa-rotor { transform-box: fill-box; transform-origin: center; animation: fa-spin var(--dur-rotor) linear infinite; }
/* Aircraft inside a scene stand still: a scene is a picture. */
fa-scene .fa-prop, fa-scene .fa-rotor { animation: none; }
fa-aircraft[data-fx="land"] .fa-aircraft__sprite svg { animation: fa-squash var(--dur-land) var(--ease-bounce) infinite alternate; }
fa-aircraft[data-fx="bank"] .fa-aircraft__sprite svg { animation: fa-bank 1.6s var(--ease-sway) infinite alternate; }

fa-icon { width: var(--fa-icon, 1.5em); height: var(--fa-icon, 1.5em); vertical-align: -0.35em; }
fa-runway { width: var(--fa-length, 816px); max-width: 100%; }
fa-helipad { width: 160px; height: 160px; }
fa-cloud { width: 172px; opacity: var(--opacity-cloud); filter: drop-shadow(10px 16px 4px var(--shadow-ground)); }
fa-cloud[data-loop] { animation: fa-drift 9s var(--ease-sway) infinite alternate; }
