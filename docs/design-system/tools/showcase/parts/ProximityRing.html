<article class="sc-comp" id="c-ProximityRing">
  <header><h3>Proximity ring</h3><p>A slowly spinning dashed red ring around every aircraft that is too close to another one. A warning, not a failure: they have not touched yet.</p></header>
  <div class="sc-demo fa-stage fa-stage--field"><div class="fa-item" style="flex-direction:row;gap:8px"><span style="position:relative;display:grid;place-items:center;width:110px;height:110px"><fa-aircraft type="jet" livery="1"></fa-aircraft><svg class="fa-warn-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="fa-warn-ring__casing" cx="50" cy="50" r="46"/><circle class="fa-warn-ring__dash" cx="50" cy="50" r="46"/></svg></span><span style="position:relative;display:grid;place-items:center;width:110px;height:110px"><fa-aircraft type="turboprop" livery="4"></fa-aircraft><svg class="fa-warn-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="fa-warn-ring__casing" cx="50" cy="50" r="46"/><circle class="fa-warn-ring__dash" cx="50" cy="50" r="46"/></svg></span></div><span class="fa-chip fa-chip--cherry"><fa-icon name="warning"></fa-icon>Too close: both aircraft get a ring</span><div class="fa-item" style="flex-direction:row;gap:8px;background:var(--blackout,#03050f);padding:12px;border-radius:12px"><span style="position:relative;display:grid;place-items:center;width:110px;height:110px"><fa-aircraft type="jet" livery="1"></fa-aircraft><svg class="fa-warn-ring" viewBox="0 0 100 100" aria-hidden="true" style="animation:none"><circle class="fa-warn-ring__casing" cx="50" cy="50" r="46"/><circle class="fa-warn-ring__dash" cx="50" cy="50" r="46" style="stroke:var(--danger)"/></svg></span><span style="position:relative;display:grid;place-items:center;width:110px;height:110px"><fa-aircraft type="turboprop" livery="4"></fa-aircraft><svg class="fa-warn-ring" viewBox="0 0 100 100" aria-hidden="true" style="animation:none"><circle class="fa-warn-ring__casing" cx="50" cy="50" r="46"/><circle class="fa-warn-ring__dash" cx="50" cy="50" r="46" style="stroke:var(--danger)"/></svg></span></div><span class="fa-chip fa-chip--cherry"><fa-icon name="warning"></fa-icon>Collision: red ring, not spinning, on the faded view</span></div>
</article>
