schema: spec-driven
githubCopilot:
  cloudAgent: false

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  proposal:
    - 'Include a line of its own "GitHub issue: #<number>" naming the issue this change implements. The issue must mention this change''s exact name.'

operations:
  apply:
    guidance:
      - Follow .claude/skills/git-workflow/SKILL.md. Do not implement unless the change names an open GitHub issue and that issue names the change.
      - Implement in a new worktree on branch change/<change-name>, created from development. Commit per completed task. Push and open a pull request into development when all tasks are done or only human checks remain.
  archive:
    guidance:
      - Follow .claude/skills/git-workflow/SKILL.md. Archive on development after the pull request is merged, then commit and push.
      - Close the related GitHub issue, move it to the Done lane if it is on a GitHub project, remove the worktree, and delete the change branch locally and on the remote.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
